syntax = "proto3";

package quorumdb.raft;

option go_package = "quorumdb/internal/raftpb";

// Raft carries peer-to-peer consensus traffic. Each node keeps one
// client stream open to every peer; delivery is best effort, which Raft
// tolerates by retrying.
service Raft {
  rpc Stream(stream Batch) returns (Ack);
}

enum MessageType {
  MSG_PRE_VOTE = 0;
  MSG_PRE_VOTE_RESP = 1;
  MSG_VOTE = 2;
  MSG_VOTE_RESP = 3;
  MSG_APP = 4;
  MSG_APP_RESP = 5;
  MSG_HEARTBEAT = 6;
  MSG_HEARTBEAT_RESP = 7;
  MSG_SNAP = 8;
}

enum EntryType {
  ENTRY_NORMAL = 0;
  ENTRY_NOOP = 1;
}

message Entry {
  uint64 term = 1;
  uint64 index = 2;
  EntryType type = 3;
  bytes data = 4;
}

message Snapshot {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
}

message Message {
  MessageType type = 1;
  uint64 from = 2;
  uint64 to = 3;
  uint64 term = 4;
  uint64 log_term = 5;
  uint64 index = 6;
  repeated Entry entries = 7;
  uint64 commit = 8;
  bool reject = 9;
  uint64 hint = 10;
  uint64 context = 11;
  Snapshot snapshot = 12;
}

message Batch {
  repeated Message messages = 1;
}

message Ack {}
